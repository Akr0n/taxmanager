name: Secret scan (gitleaks)

# Difesa lato server contro l'inserimento di segreti:
#  - su ogni push/PR verso develop e main (scansione dei commit dell'evento)
#  - scansione COMPLETA della history una volta a settimana (schedule)
#  - eseguibile a mano (workflow_dispatch)
# Complementa l'hook locale .githooks/pre-commit e il secret scanning nativo di GitHub.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # lunedì 06:00 UTC — full-history scan periodico

permissions:
  contents: read
  pull-requests: write    # consente a gitleaks di annotare le PR con i findings

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (history completa)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks deve vedere TUTTI i commit, non solo l'ultimo

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE non necessario: gratuito per repo pubblici e account personali.
          GITLEAKS_CONFIG: .gitleaks.toml
